name: iOS Build
run-name: iOS Build ${{ inputs.build_id || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build'
        required: false
        type: string
        default: ''
      ios_path:
        description: 'Path to the project root'
        required: false
        type: string
        default: '.'
      scheme:
        description: 'Xcode scheme (CMake target name)'
        required: false
        type: string
        default: 'ReChigros'
      use_signing:
        description: 'Enable code signing (unused by this unsigned workflow)'
        required: false
        type: boolean
        default: false
      configuration:
        description: 'Xcode build configuration'
        required: false
        type: string
        default: 'Release'
      flutter_version:
        description: 'Unused; declared for tool compatibility'
        required: false
        type: string
        default: ''
      jdk_version:
        description: 'Unused; declared for tool compatibility'
        required: false
        type: string
        default: '17'
      profile:
        description: 'Selected builder.json profile as JSON'
        required: false
        type: string
        default: '{}'
      build_number:
        description: 'CFBundleVersion to stamp on the build'
        required: false
        type: string
        default: ''

jobs:
  build:
    # GitHub's arm64 macOS pool is heavily contended; the Intel image still cross-compiles
    # the arm64 app because CMAKE_OSX_ARCHITECTURES pins the slice.
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The dispatch always runs the workflow from the default branch, so the
      # sources come from a snapshot ref pushed by the CLI instead.
      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --no-tags --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          # Restoring the whole generated tree makes a rebuild incremental: only the files
          # that changed are recompiled instead of SDL3, the framework and the application
          # all over again. The key covers dependency and project definitions only.
          path: |
            third_party/cache
            build/ios
          key: ios-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt', 'src/**/CMakeLists.txt', 'platform/ios/**') }}
          restore-keys: |
            ios-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure CMake project
        env:
          IOS_PATH: ${{ inputs.ios_path }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          cd "${IOS_PATH:-.}"
          cmake --version
          # A restored tree whose inputs and configuration match needs no configure pass:
          # the generated Xcode project is already there and the slow part of an unchanged
          # run is the dependency probing, not the build.
          INPUT_HASH="${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt', 'src/**/CMakeLists.txt', 'platform/ios/**') }}-${CONFIGURATION:-Release}"
          if [ -f build/ios/.configure-inputs ] \
             && [ "$(cat build/ios/.configure-inputs)" = "$INPUT_HASH" ] \
             && [ -f build/ios/CMakeCache.txt ]; then
            echo "Configure restored from cache for inputs $INPUT_HASH"
            exit 0
          fi
          cmake -S . -B build/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_BUILD_TYPE="${CONFIGURATION:-Release}" \
            -DRECHIGROS_BUILD_TESTS=OFF
          printf '%s\n' "$INPUT_HASH" > build/ios/.configure-inputs

      - name: Build application
        env:
          IOS_PATH: ${{ inputs.ios_path }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          cd "${IOS_PATH:-.}"
          CONFIG="${CONFIGURATION:-Release}"
          TARGET="${SCHEME:-ReChigros}"
          xcodebuild \
            -project build/ios/ReChigros.xcodeproj \
            -target "$TARGET" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        env:
          IOS_PATH: ${{ inputs.ios_path }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          cd "${IOS_PATH:-.}"
          APP=$(find build/ios -type d -name 'ReChigros.app' -path '*Release-iphoneos*' -print -quit)
          if [ -z "$APP" ]; then
            APP=$(find build/ios -type d -name 'ReChigros.app' -print -quit)
          fi
          if [ -z "$APP" ]; then
            echo "::error::ReChigros.app was not produced"
            find build/ios -maxdepth 3 -type d | head -40
            exit 1
          fi
          echo "Packaging $APP"
          test -f "$APP/ReChigros"
          test -f "$APP/Info.plist"
          test -d "$APP/assets"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -rq "../${BUILD_ID}.ipa" Payload
          ls -lh "../${BUILD_ID}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: build/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "## iOS Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build ID:** ${{ inputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Configuration:** ${{ inputs.configuration }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Snapshot:** ${{ inputs.snapshot_ref }}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/*.ipa >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

plugins { id 'com.android.application' }

def projectRoot = file('../../..')
def sdlRoot = new File(projectRoot, 'third_party/SDL')
def releaseKeystore = System.getenv('RECHIGROS_KEYSTORE')

android {
    namespace 'com.wuying.chigros'
    compileSdk 36
    ndkVersion '27.0.12077973'

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('RECHIGROS_STORE_PASSWORD')
                keyAlias System.getenv('RECHIGROS_KEY_ALIAS')
                keyPassword System.getenv('RECHIGROS_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.wuying.chigros'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20', '-O2', '-fexceptions', '-frtti'
                arguments '-DRECHIGROS_BUILD_TESTS=OFF',
                          "-DRECHIGROS_SDL_SOURCE=${sdlRoot.absolutePath.replace('\\', '/')}",
                          '-DANDROID_STL=c++_shared'
            }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    externalNativeBuild {
        cmake { path projectRoot.toPath().resolve('CMakeLists.txt').toFile(); version '3.22.1' }
    }
    sourceSets {
        main.java.srcDirs += new File(sdlRoot, 'android-project/app/src/main/java')
        main.assets.srcDirs = [new File(projectRoot, 'assets')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
